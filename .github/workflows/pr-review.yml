# PR Review — caller for lenaxia/ai-workflows.
#
# Delegates the PR Review AI flow to the central reusable workflow, which owns
# prompt assembly, the opencode run, and the once-per-thread command footer.
#
# Pinned to ai-workflows v0.2.10 — bump by editing the tag below (or via propagate.yml).
# Requires OPENAI_API_KEY / OPENAI_API_BASE secrets + OPENAI_MODEL variable (inherited).

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  respond::
    uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@v0.2.20
    secrets: inherit
    with:
      version: v0.2.20
      project_name: RagnaAlbum
